name: Deploy DTI OneLink to MonsterASP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: windows-latest

    env:
      MONSTER_CONNECTION_STRING: ${{ secrets.MONSTER_CONNECTION_STRING }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      DIAGNOSTICS_TOKEN: ${{ secrets.DIAGNOSTICS_TOKEN }}

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore packages
        run: dotnet restore

      - name: Publish application
        shell: pwsh
        run: dotnet publish -c Release --no-restore -o "$env:GITHUB_WORKSPACE\publish"

      - name: Create production configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BREVO_API_KEY) -or [string]::IsNullOrWhiteSpace($env:BREVO_SENDER_EMAIL)) {
            Write-Warning "BREVO_API_KEY or BREVO_SENDER_EMAIL is not set: emails (codes, notices) will not be sent."
          }

          $config = @{
            ConnectionStrings = @{
              DefaultConnection = $env:MONSTER_CONNECTION_STRING
            }
            Brevo = @{
              ApiKey = $env:BREVO_API_KEY
              SenderEmail = $env:BREVO_SENDER_EMAIL
              SenderName = "DTI OneLink"
            }
            App = @{
              BaseUrl = $env:APP_BASE_URL
            }
            Diagnostics = @{
              Token = $env:DIAGNOSTICS_TOKEN
            }
          } | ConvertTo-Json -Depth 3

          Set-Content `
            -Path "$env:GITHUB_WORKSPACE\publish\appsettings.Production.json" `
            -Value $config `
            -Encoding UTF8

      - name: Install Web Deploy if needed
        shell: pwsh
        run: |
          $msdeploy = "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"

          if (!(Test-Path $msdeploy)) {
            choco install webdeploy -y --no-progress
          }

          if (!(Test-Path $msdeploy)) {
            throw "Web Deploy could not be installed."
          }

      - name: Deploy to MonsterASP
        shell: pwsh
        env:
          MONSTER_WEBDEPLOY_URL: ${{ secrets.MONSTER_WEBDEPLOY_URL }}
          MONSTER_WEBDEPLOY_SITE: ${{ secrets.MONSTER_WEBDEPLOY_SITE }}
          MONSTER_WEBDEPLOY_USERNAME: ${{ secrets.MONSTER_WEBDEPLOY_USERNAME }}
          MONSTER_WEBDEPLOY_PASSWORD: ${{ secrets.MONSTER_WEBDEPLOY_PASSWORD }}
        run: |
          $msdeploy = "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          $publishPath = "$env:GITHUB_WORKSPACE\publish"

          & $msdeploy `
            -verb:sync `
            "-source:contentPath=$publishPath" `
            "-dest:contentPath=$env:MONSTER_WEBDEPLOY_SITE,computerName=$env:MONSTER_WEBDEPLOY_URL,userName=$env:MONSTER_WEBDEPLOY_USERNAME,password=$env:MONSTER_WEBDEPLOY_PASSWORD,authType=Basic,includeAcls=False" `
            -allowUntrusted `
            -enableRule:AppOffline `
            -enableRule:DoNotDeleteRule `
            -disableLink:AppPoolExtension `
            -disableLink:ContentExtension `
            -disableLink:CertificateExtension `
            -verbose

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
