<title>DTI OneLink Level 0 DFD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* grayscale, orthogonal-routed DFD matching a standard engineering/thesis
     reference style: entities left, numbered processes center, data stores
     right, with every flow name listed as stacked text beside its process box */
  :root{
    --bg:#ffffff; --surface:#ffffff; --fg:#111111; --muted:#555555;
    --entity-fill:#dcdcdc; --border:#111111;
    --font-body:'IBM Plex Sans',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161a; --surface:#1b1e24; --fg:#e8e8e8; --muted:#a7acb3;
      --entity-fill:#3a3f47; --border:#e8e8e8; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161a; --surface:#1b1e24; --fg:#e8e8e8; --muted:#a7acb3;
    --entity-fill:#3a3f47; --border:#e8e8e8; color-scheme:dark;
  }
  body{background:var(--bg); color:var(--fg); font-family:var(--font-body);
    padding-inline:16px; padding-block:28px;}
  .wrap{max-width:1200px; margin:0 auto;}
  .eyebrow{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); margin:0 0 4px;}
  h1{font-weight:700; font-size:clamp(20px,3.6vw,28px); margin:0 0 2px; text-align:center;}
  .sub{color:var(--muted); font-size:13px; margin:0 0 18px; text-align:center;}
  figure{margin:0; background:var(--surface); border:1px solid var(--border);
    border-radius:4px; padding:16px; overflow-x:auto;}
  svg{display:block; width:100%; height:auto; margin:0 auto;}
  figcaption{font-size:12.5px; color:var(--muted); margin-top:12px; max-width:92ch;}
</style>
